# Unitree G1 + Dex3, AllMerged maincam (2851 episodes, 12 instructions,
# cam_left_high only, 30 fps, 28-D absolute joint positions).
# Source: the UnifoLM-WMA training set g1_dex3_allmerged_maincam (corrected
# per-episode instructions), converted to LeRobot v2.1 by
# scripts/g1_dex3/convert_wma_to_lerobot.py (videos hardlinked, not re-encoded).
#
# Deltas vs configs/data/robotwin.yaml (the closest upstream config: joint
# positions, z-score, no action_state_transforms):
#   - 1 camera instead of 3 -> concat_multi_camera null, num_output_cameras 1
#   - 28-D action/state instead of 14
#   - video_size 384x512 = 640x480 scaled by 0.8, aspect-preserving, no crop
#     (Wan2.2 VAE x16 + patch 2 -> 12x16 = 192 tokens per latent frame)
#   - norm stats computed once (smoke run with pretrained_norm_stats=null)
#     and frozen into the dataset's meta/ so every run uses the same file
# num_frames 33 / action_video_freq_ratio 4 kept: 32 actions (1.07 s @ 30 fps)
# and 9 video frames per chunk, as in both upstream configs.
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /datasets/G1_Dex3_AllMerged_MainCam_LeRobot21
  shape_meta:
    images:
      - key: cam_left_high
        raw_shape: [3, 480, 640]
        shape: [3, 384, 512]
    action:
      - key: default
        raw_shape: 28
        shape: 28
    state:
      - key: default
        raw_shape: 28
        shape: 28
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [384, 512] # final resize video (H, W)
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: /datasets/G1_Dex3_AllMerged_MainCam_LeRobot21/meta/fastwam_dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 28
    proprio_output_dim: 28

    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 512]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [384, 512]
  text_embedding_cache_dir: /docker_data/cache/text_embeds/g1_dex3_maincam
  use_text_embed_cache: true
  context_len: 128

val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs: ${data.train.dataset_dirs}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: 1
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: null
  val_set_proportion: ${data.train.val_set_proportion}
  is_training_set: false
  pretrained_norm_stats: ${data.train.pretrained_norm_stats}
  skip_padding_as_possible: false
  concat_multi_camera: null
  processor: ${data.train.processor}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  use_text_embed_cache: true
  context_len: 128
